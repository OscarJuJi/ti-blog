name: Daily digest

on:
  schedule:
    # 13:00 UTC is 07:00 in Mexico City, which does not observe DST.
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  write:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.commit.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write the digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m agent.run

      - name: Commit it
        id: commit
        run: |
          if [ -z "$(git status --porcelain content/posts)" ]; then
            echo "today's digest is already published"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts
          git commit -m "Daily digest for $(date -u +%Y-%m-%d)"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: write
    if: needs.write.outputs.published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-deploy.yml
